version: '3.8'

services:
  # ── MongoDB Database ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: askra-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: askrab
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend & Agentic Pipeline ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: askra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=askrab
      - LLM_BASE_URL=${LLM_BASE_URL:-https://llm.saranshh.me/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-gemma}
      - LLM_CODE_MODEL=${LLM_CODE_MODEL:-gemma}
      - LLM_ROUTER_MODEL=${LLM_ROUTER_MODEL:-gemma}
      - LLM_REWRITER_MODEL=${LLM_REWRITER_MODEL:-gemma}
      - JWT_SECRET=${JWT_SECRET:-askrab-super-secret-jwt-key-change-in-production}
      - APP_ENV=production
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
      - UPLOAD_DIR=/app/uploads
      - FAISS_INDEX_DIR=/app/faiss_store
      - OCR_SERVER_URL=http://host.docker.internal:10000
      - OCR_ENABLED=true
    volumes:
      - backend_uploads:/app/uploads
      - backend_faiss:/app/faiss_store
    depends_on:
      mongodb:
        condition: service_healthy

  # ── React Frontend & Nginx Reverse Proxy ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: askra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local
  backend_faiss:
    driver: local
